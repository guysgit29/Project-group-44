{% extends "base.html" %}
{% block title %}FLYTAU - דף הבית{% endblock %}

{% block content %}

<section class="home-hero">
  <h1>המסע שלך מתחיל כאן</h1>
  <p>מצאו את הטיסה המושלמת ליעד הבא שלכם.</p>
</section>

<div class="home-search-wrap">
  <section class="home-search-card">
    <h2 style="text-align:center; margin:0 0 18px;">חיפוש טיסות</h2>

    <form action="{{ url_for('search_flights') }}" method="GET">
      <div class="home-search-grid">
        <div class="field">
          <label for="origin">מוצא</label>
          <select name="origin" id="origin" required>
            <option value="" disabled selected>בחר מקור</option>
            {% for item in origins %}
              <option value="{{ item.origin }}">{{ item.origin }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="field">
          <label for="destination">יעד</label>
          <select name="destination" id="destination" required>
            <option value="" disabled selected>בחר יעד</option>
            {% for item in destinations %}
              <option value="{{ item.destination }}">{{ item.destination }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="home-search-actions">
        <button class="btn btn-primary" type="submit">חפש טיסות</button>
      </div>
    </form>
  </section>
</div>

{% endblock %}
