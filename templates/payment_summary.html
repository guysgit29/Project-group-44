{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 500px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 50px;">
    <h3>סיכום הזמנה - טיסה {{ flight_number }}</h3>
    <ul style="list-style: none; padding: 0;">
        {% for item in details %}
            <li style="padding: 10px 0; border-bottom: 1px solid #eee;">
                מושב <strong>{{ item.seat_id }}</strong> ({{ item.class_name }}) - ₪{{ item.base_price }}
            </li>
        {% endfor %}
    </ul>
    <h4 style="color: #28a745; text-align: center; font-size: 24px;">סה"כ לתשלום: ₪{{ total }}</h4>
    
    <form action="{{ url_for('home_page') }}" method="GET">
        <button type="submit" class="btn-select" style="width: 100%; padding: 15px;">אשר ובצע תשלום</button>
    </form>
</div>
{% endblock %}
